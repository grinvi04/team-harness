# Generated by scripts/generate-stack-templates.mjs; edit templates/stacks/<stack>/ci/, templates/ci/common/ and templates/stacks.json.
# ci-gate — React + Vite     — SPA 프론트엔드
name: ci-gate

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited, stacked]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22  # CUSTOMIZE: .nvmrc 있으면 node-version-file: .nvmrc 로 교체
          cache: npm

      - run: npm ci
      - run: npm run lint                       # Use the project-owned eslint configuration
      - run: npm run type-check     # Use the project-owned type checker
      - run: npm run test:unit       # Use the project-owned unit tests
      - run: npm run build                       # Use the project-owned framework build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Organization repo는 GITLEAKS_LICENSE secret 필요 (개인 repo는 불필요)
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
