# PR code is data only. Workflow and validator come from the trusted default-branch SHA.
name: commitlint-trusted

on:
  pull_request_target:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited, stacked]

permissions:
  contents: read

jobs:
  commitlint-trusted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: 신뢰 원본으로 PR 커밋 metadata 검사
        env:
          BASE_REF: ${{ github.event.pull_request.stack.base.ref || github.event.pull_request.base.ref }}
          PARENT_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_STATE: ${{ github.event.pull_request.state }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          EVENT_ACTION: ${{ github.event.action }}
          READ_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || ! [[ "$BASE_REF" = main || "$BASE_REF" = develop ]]; then
            echo "잘못된 PR metadata입니다." >&2
            exit 1
          fi
          git check-ref-format --branch "$PARENT_REF" >/dev/null
          # The required job always runs; only a merged PR's edited record is non-applicable.
          case "$PR_STATE:$PR_MERGED:$EVENT_ACTION" in
            closed:true:edited)
              echo "병합된 PR의 기록 변경: 새 커밋 검사는 비적용입니다."
              exit 0
              ;;
            open:false:opened|open:false:synchronize|open:false:reopened|open:false:edited|open:false:stacked) ;;
            *)
              echo "잘못된 PR 상태·이벤트 metadata입니다." >&2
              exit 1
              ;;
          esac
          # Authentication exists only in each read-only fetch process, not Git config or Node.
          FETCH_AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$READ_TOKEN" | base64 | tr -d '\n')"
          unset READ_TOKEN
          fetch_objects() {
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="$FETCH_AUTH" \
              git fetch --no-tags origin "$@"
          }
          fetch_objects "refs/pull/$PR_NUMBER/head"
          if [ "$(git rev-parse FETCH_HEAD)" != "$HEAD_SHA" ]; then
            echo "PR head가 변경되었습니다. 최신 이벤트의 검사가 필요합니다." >&2
            exit 1
          fi
          fetch_objects "$BASE_SHA"
          if [ "$PARENT_REF" = main ]; then
            fetch_objects develop
            DEVELOP_SHA="$(git rev-parse FETCH_HEAD)"
            unset FETCH_AUTH
            # A genuinely empty range is still invalid. Protected exclusions are distinct.
            FORWARD_COMMITS="$(git rev-list "$BASE_SHA..$HEAD_SHA" --)"
            if [ -z "$FORWARD_COMMITS" ]; then
              echo "빈 main PR commit 범위는 허용하지 않습니다." >&2
              exit 1
            fi
            RELEASE_COMMITS="$(git rev-list "$BASE_SHA..$HEAD_SHA" "^$DEVELOP_SHA" --)"
            if [ -z "$RELEASE_COMMITS" ]; then
              [[ "$HEAD_REF" == release/* ]] || { echo "순수 develop 전달은 release 브랜치만 허용합니다." >&2; exit 1; }
              git merge-base --is-ancestor "$HEAD_SHA" "$DEVELOP_SHA"
              echo "보호된 develop에서 이미 검사한 release 이력만 있어 새 커밋 검사는 비적용입니다."
            else
              node scripts/check-commit-message.cjs --range "$BASE_SHA..$HEAD_SHA" --exclude "$DEVELOP_SHA"
            fi
          elif [[ "$PARENT_REF" = develop && "$HEAD_REF" == sync/backmerge-* ]]; then
            fetch_objects main
            MAIN_SHA="$(git rev-parse FETCH_HEAD)"
            unset FETCH_AUTH
            BACKMERGE_COMMITS="$(git rev-list "$BASE_SHA..$HEAD_SHA" "^$MAIN_SHA" --)"
            if [ -z "$BACKMERGE_COMMITS" ]; then
              echo "main에 없는 backmerge commit이 없어 검사를 마칩니다."
            else
              node scripts/check-commit-message.cjs --range "$BASE_SHA..$HEAD_SHA" --exclude "$MAIN_SHA"
            fi
          else
            unset FETCH_AUTH
            node scripts/check-commit-message.cjs --range "$BASE_SHA..$HEAD_SHA"
          fi
      # Team Harness only: candidate checkout is data, never the validator source.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        if: github.event.pull_request.state == 'open'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .runtime/doc-sync-candidate
          fetch-depth: 0
          persist-credentials: false
      - name: 신뢰 원본으로 진행 문서 선언 검사
        if: github.event.pull_request.state == 'open'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CANDIDATE="$GITHUB_WORKSPACE/.runtime/doc-sync-candidate"
          if [ "$(git -C "$CANDIDATE" rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "문서 검사 후보 SHA 불일치" >&2; exit 1
          fi
          node "$GITHUB_WORKSPACE/plugins/harness-guard/scripts/check-document-sync.mjs" \
            --repo "$CANDIDATE" --event "$GITHUB_EVENT_PATH" --committed
