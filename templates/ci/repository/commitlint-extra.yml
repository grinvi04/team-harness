      # Team Harness only: candidate checkout is data, never the validator source.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        if: github.event.pull_request.state == 'open'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .runtime/doc-sync-candidate
          fetch-depth: 0
          persist-credentials: false
      - name: 신뢰 원본으로 진행 문서 선언 검사
        if: github.event.pull_request.state == 'open'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CANDIDATE="$GITHUB_WORKSPACE/.runtime/doc-sync-candidate"
          if [ "$(git -C "$CANDIDATE" rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "문서 검사 후보 SHA 불일치" >&2; exit 1
          fi
          node "$GITHUB_WORKSPACE/plugins/harness-guard/scripts/check-document-sync.mjs" \
            --repo "$CANDIDATE" --event "$GITHUB_EVENT_PATH" --committed
